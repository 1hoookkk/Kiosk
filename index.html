<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Robot Vacuum Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-touch-callout: none;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Video container */
        #videoContainer {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #videoFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Start overlay */
        #startOverlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: opacity 0.5s ease;
        }

        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .welcome-text {
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 50px;
            text-align: center;
        }

        #startButton {
            background: white;
            color: #667eea;
            border: none;
            padding: 20px 50px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #startButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        #startButton:active {
            transform: translateY(0);
        }

        /* Product info overlay */
        #productInfo {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            border-radius: 50px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #productInfo.visible {
            opacity: 1;
        }

        #productTitle {
            font-size: 18px;
            color: white;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }

        /* Navigation */
        #navigation {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #navigation.visible {
            opacity: 1;
        }

        .nav-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .nav-button:active {
            transform: scale(0.95);
        }

        /* Progress dots */
        #dots {
            display: flex;
            gap: 8px;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 50px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.2);
        }

        .dot.active {
            background: white;
            width: 30px;
            border-radius: 4px;
        }

        /* Progress bar */
        #progressBar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 90;
        }

        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            opacity: 0.5;
        }

        /* Swipe indicators */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            animation: swipeAnim 1.2s ease-out forwards;
            z-index: 80;
        }

        .swipe-indicator.left {
            left: 30px;
            animation: swipeAnimLeft 1.2s ease-out forwards;
        }

        .swipe-indicator.right {
            right: 30px;
            animation: swipeAnimRight 1.2s ease-out forwards;
        }

        @keyframes swipeAnimLeft {
            0% { opacity: 0; transform: translateY(-50%) translateX(20px); }
            40% { opacity: 1; transform: translateY(-50%) translateX(0); }
            100% { opacity: 0; transform: translateY(-50%) translateX(-20px); }
        }

        @keyframes swipeAnimRight {
            0% { opacity: 0; transform: translateY(-50%) translateX(-20px); }
            40% { opacity: 1; transform: translateY(-50%) translateX(0); }
            100% { opacity: 0; transform: translateY(-50%) translateX(20px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-text {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
                padding: 0 20px;
            }

            #productTitle {
                font-size: 16px;
            }

            #productInfo {
                top: 20px;
                padding: 12px 25px;
            }

            #navigation {
                bottom: 30px;
            }
        }

        /* Hide on tap */
        .hide-ui #productInfo,
        .hide-ui #navigation {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Start screen -->
        <div id="startOverlay">
            <div class="welcome-text">Robot Vacuum</div>
            <div class="subtitle">Discover the latest models</div>
            <button id="startButton">Start Showcase</button>
        </div>

        <!-- Video player -->
        <div id="videoContainer">
            <iframe id="videoFrame"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
            </iframe>
            <div class="loading" id="loading">Loading videos...</div>
        </div>

        <!-- Product name -->
        <div id="productInfo">
            <div id="productTitle">Product Name</div>
        </div>

        <!-- Navigation -->
        <div id="navigation">
            <button class="nav-button" id="prevBtn">‹</button>
            <div id="dots"></div>
            <button class="nav-button" id="nextBtn">›</button>
        </div>

        <!-- Progress bar -->
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
    </div>

    <script>
        // Cleaned and verified video list
        const videos = [
            { title: "Roborock S8 MaxV Ultra", id: "87O6hE4cKPM" },
            { title: "Dreame X40 Ultra", id: "VKYolDuOwGg" },
            { title: "Dreame L40 Ultra", id: "Ebkp8Y02z-M" },
            { title: "Dreame L20 Ultra", id: "bTT5nnP74Jo" },
            { title: "ECOVACS X2 OMNI", id: "vknCyYVN8Z8" },
            { title: "ECOVACS Mopping Technology", id: "5gcfk1V16Qs" },
            { title: "EUFY X10 Pro Omni", id: "bCzMVZZ20ig" },
            { title: "EUFY Clean X9 Pro", id: "QRJ6TPcN8IU" },
            { title: "NARWAL Freo", id: "G2RmztS8Go0" },
            { title: "Robot Vacuum Technology", id: "LPUrm2svxtk" },
            { title: "Advanced Sweeping Tech", id: "exV9XhEKLvc" },
            { title: "Robot Vacuum Comparison", id: "nLvvbTSC6jQ" },
            { title: "Buying Guide 2024", id: "V-7sQlWY4M0" },
            { title: "Worth The Investment?", id: "SBwWtPXwJgM" }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let progressInterval = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let hideUITimeout = null;

        const elements = {
            startOverlay: document.getElementById('startOverlay'),
            startButton: document.getElementById('startButton'),
            videoFrame: document.getElementById('videoFrame'),
            productTitle: document.getElementById('productTitle'),
            productInfo: document.getElementById('productInfo'),
            navigation: document.getElementById('navigation'),
            dotsContainer: document.getElementById('dots'),
            progressFill: document.getElementById('progressFill'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            loading: document.getElementById('loading'),
            app: document.getElementById('app')
        };

        // Initialize
        function init() {
            createDots();
            setupEventListeners();
        }

        // Create navigation dots
        function createDots() {
            elements.dotsContainer.innerHTML = '';
            videos.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (index === 0) dot.classList.add('active');
                dot.onclick = () => jumpToVideo(index);
                elements.dotsContainer.appendChild(dot);
            });
        }

        // Start showcase
        function startShowcase() {
            elements.startOverlay.classList.add('hidden');
            elements.productInfo.classList.add('visible');
            elements.navigation.classList.add('visible');
            elements.loading.style.display = 'none';

            isPlaying = true;
            loadVideo(0);
            startAutoplay();

            // Auto-hide UI after 3 seconds
            startAutoHideUI();
        }

        // Load video
        function loadVideo(index) {
            currentIndex = index;
            const video = videos[index];

            // YouTube embed with optimal parameters
            const params = new URLSearchParams({
                autoplay: '1',
                mute: '1',
                controls: '0',
                showinfo: '0',
                rel: '0',
                modestbranding: '1',
                playsinline: '1',
                loop: '1',
                playlist: video.id,
                enablejsapi: '1'
            });

            elements.videoFrame.src = `https://www.youtube.com/embed/${video.id}?${params.toString()}`;
            elements.productTitle.textContent = video.title;

            updateDots();
            resetProgress();
        }

        // Update dot indicators
        function updateDots() {
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        // Navigation
        function nextVideo() {
            currentIndex = (currentIndex + 1) % videos.length;
            loadVideo(currentIndex);
            showSwipeIndicator('right');
            resetAutoplay();
        }

        function prevVideo() {
            currentIndex = (currentIndex - 1 + videos.length) % videos.length;
            loadVideo(currentIndex);
            showSwipeIndicator('left');
            resetAutoplay();
        }

        function jumpToVideo(index) {
            currentIndex = index;
            loadVideo(currentIndex);
            resetAutoplay();
        }

        // Autoplay
        function startAutoplay() {
            stopAutoplay();

            const duration = 15000; // 15 seconds
            let elapsed = 0;

            progressInterval = setInterval(() => {
                elapsed += 50;
                const progress = (elapsed / duration) * 100;
                elements.progressFill.style.width = progress + '%';

                if (elapsed >= duration) {
                    nextVideo();
                }
            }, 50);
        }

        function stopAutoplay() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resetAutoplay() {
            if (isPlaying) {
                stopAutoplay();
                startAutoplay();
            }
        }

        function resetProgress() {
            elements.progressFill.style.width = '0%';
        }

        // Show swipe indicator
        function showSwipeIndicator(direction) {
            const indicator = document.createElement('div');
            indicator.className = `swipe-indicator ${direction}`;
            indicator.textContent = direction === 'left' ? '‹' : '›';
            elements.videoContainer.appendChild(indicator);
            setTimeout(() => indicator.remove(), 1200);
        }

        // Auto-hide UI
        function startAutoHideUI() {
            clearTimeout(hideUITimeout);
            elements.app.classList.remove('hide-ui');

            hideUITimeout = setTimeout(() => {
                elements.app.classList.add('hide-ui');
            }, 3000);
        }

        // Touch handling
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            startAutoHideUI();
        }

        function handleTouchEnd(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            // Only swipe horizontally if more horizontal than vertical
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) {
                    nextVideo();
                } else {
                    prevVideo();
                }
            }
        }

        // Event listeners
        function setupEventListeners() {
            elements.startButton.onclick = startShowcase;
            elements.nextBtn.onclick = nextVideo;
            elements.prevBtn.onclick = prevVideo;

            elements.videoContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
            elements.videoContainer.addEventListener('touchend', handleTouchEnd, { passive: true });

            // Show UI on touch
            elements.app.addEventListener('touchstart', startAutoHideUI, { passive: true });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (!isPlaying) return;

                if (e.key === 'ArrowLeft') {
                    prevVideo();
                } else if (e.key === 'ArrowRight') {
                    nextVideo();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (isPlaying) {
                        stopAutoplay();
                        isPlaying = false;
                    } else {
                        startAutoplay();
                        isPlaying = true;
                    }
                }
            });

            // Prevent sleep
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => {});
            }
        }

        // Start app
        init();
    </script>
</body>
</html>
