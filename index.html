<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Harvey Norman - Robot Vacuums</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-touch-callout: none;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Minimal header */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(227, 24, 55, 0.95) 0%, rgba(227, 24, 55, 0.85) 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        #logo {
            font-size: 20px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
        }

        #productTitle {
            font-size: 16px;
            color: white;
            font-weight: 500;
        }

        /* Full screen video */
        #videoContainer {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        #videoFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Start button overlay */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.3s;
        }

        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #startButton {
            background: #e31837;
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 24px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(227, 24, 55, 0.4);
            transition: all 0.3s;
        }

        #startButton:active {
            transform: scale(0.95);
        }

        .start-text {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 18px;
        }

        /* Simple navigation dots */
        #dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 50;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.3s;
        }

        .dot.active {
            background: #e31837;
            width: 24px;
            border-radius: 4px;
        }

        /* Progress bar */
        #progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #e31837;
            width: 0%;
            transition: width 0.1s linear;
            z-index: 50;
        }

        /* Swipe hint */
        .swipe-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 40px;
            pointer-events: none;
            animation: swipeFade 1.5s ease-out forwards;
            z-index: 60;
        }

        .swipe-hint.left { left: 20px; }
        .swipe-hint.right { right: 20px; }

        @keyframes swipeFade {
            0% { opacity: 0; transform: translateY(-50%) translateX(0); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-50%) translateX(var(--direction)); }
        }

        /* iPad specific */
        @media (min-width: 768px) {
            #header {
                padding: 20px 30px;
            }

            #logo {
                font-size: 24px;
            }

            #productTitle {
                font-size: 18px;
            }

            #startButton {
                font-size: 28px;
                padding: 30px 80px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Start overlay -->
        <div id="startOverlay">
            <div class="start-text">Robot Vacuum Showcase</div>
            <button id="startButton">TAP TO START</button>
        </div>

        <!-- Minimal header -->
        <div id="header">
            <div id="logo">HARVEY NORMAN</div>
            <div id="productTitle">Loading...</div>
        </div>

        <!-- Video container -->
        <div id="videoContainer">
            <iframe id="videoFrame"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
            </iframe>
            <div id="progress"></div>
        </div>

        <!-- Navigation dots -->
        <div id="dots"></div>
    </div>

    <script>
        // Video playlist - cleaned URLs
        const videos = [
            { title: "ECOVACS WS2", id: "UGETKR5BlY0" },
            { title: "Roborock Z10", id: "87O6hE4cKPM" },
            { title: "ECOVACS X11", id: "vknCyYVN8Z8" },
            { title: "Dreame X50 Ultra", id: "VKYolDuOwGg" },
            { title: "Dreame X50", id: "neE7uisXKZU" },
            { title: "Dreame X50", id: "qJm17uu0cvk" },
            { title: "EUFY Robot Vacuum", id: "bCzMVZZ20ig" },
            { title: "EUFY", id: "QRJ6TPcN8IU" },
            { title: "EUFY", id: "X1BuTmM12Vl" },
            { title: "ECOVACS Mopping", id: "5gcfk1V16Qs" },
            { title: "Dreame L40 Ultra", id: "Ebkp8Y02z-M" },
            { title: "MOVA Roller", id: "JHVghFKiBc0" },
            { title: "SAROS 10R", id: "rDEJDwe5M00" },
            { title: "SAROS 10R", id: "HmNDDBYGcU0" },
            { title: "SAROS Z10", id: "87O6hE4cKPM" },
            { title: "NARWAL Flow", id: "G2RmztS8Go0" },
            { title: "NARWAL", id: "3xRYUmlzoY0" },
            { title: "NARWAL", id: "kglu5azW9wE" },
            { title: "NARWAL", id: "Or9guVKuPo0" },
            { title: "NARWAL", id: "0oIMOlsMLE0" },
            { title: "Robot Vacuum Demo", id: "LPUrm2svxtk" },
            { title: "Dreame L40", id: "bTT5nnP74Jo" },
            { title: "Dreame Aqua", id: "cmKRwiyHOpU" },
            { title: "Best Sweeping", id: "exV9XhEKLvc" },
            { title: "MOVA Z60 Setup", id: "xCaiIs5dE80" },
            { title: "Robot Vac Test", id: "nLvvbTSC6jQ" },
            { title: "Buying Guide", id: "V-7sQlWY4M0" },
            { title: "Worth The Money?", id: "SBwWtPXwJgM" }
        ];

        let currentIndex = 0;
        let autoplayTimer;
        let progressInterval;
        let hasStarted = false;
        let touchStartX = 0;

        const startOverlay = document.getElementById('startOverlay');
        const startButton = document.getElementById('startButton');
        const videoFrame = document.getElementById('videoFrame');
        const productTitle = document.getElementById('productTitle');
        const dotsContainer = document.getElementById('dots');
        const progressBar = document.getElementById('progress');
        const videoContainer = document.getElementById('videoContainer');

        // Initialize
        function init() {
            createDots();
            setupEventListeners();
        }

        // Create dots
        function createDots() {
            videos.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === 0) dot.classList.add('active');
                dot.onclick = () => goToVideo(i);
                dotsContainer.appendChild(dot);
            });
        }

        // Start the showcase
        function startShowcase() {
            hasStarted = true;
            startOverlay.classList.add('hidden');
            loadVideo(0);
            startAutoplay();
        }

        // Load video
        function loadVideo(index) {
            currentIndex = index;
            const video = videos[index];

            // Build YouTube embed URL with autoplay
            const embedUrl = `https://www.youtube.com/embed/${video.id}?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&loop=1&playlist=${video.id}&enablejsapi=1&playsinline=1`;

            videoFrame.src = embedUrl;
            productTitle.textContent = video.title;

            // Update dots
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            resetProgress();
        }

        // Navigation
        function nextVideo() {
            currentIndex = (currentIndex + 1) % videos.length;
            loadVideo(currentIndex);
            showSwipeHint('right');
        }

        function prevVideo() {
            currentIndex = (currentIndex - 1 + videos.length) % videos.length;
            loadVideo(currentIndex);
            showSwipeHint('left');
        }

        function goToVideo(index) {
            stopAutoplay();
            loadVideo(index);
            startAutoplay();
        }

        // Autoplay
        function startAutoplay() {
            stopAutoplay();

            const duration = 12000; // 12 seconds per video
            let elapsed = 0;

            progressInterval = setInterval(() => {
                elapsed += 100;
                progressBar.style.width = (elapsed / duration * 100) + '%';

                if (elapsed >= duration) {
                    nextVideo();
                }
            }, 100);
        }

        function stopAutoplay() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resetProgress() {
            progressBar.style.width = '0%';
        }

        // Swipe hint
        function showSwipeHint(direction) {
            const hint = document.createElement('div');
            hint.className = `swipe-hint ${direction}`;
            hint.style.setProperty('--direction', direction === 'left' ? '-30px' : '30px');
            hint.textContent = direction === 'left' ? '◀' : '▶';
            videoContainer.appendChild(hint);
            setTimeout(() => hint.remove(), 1500);
        }

        // Touch gestures
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
        }

        function handleTouchEnd(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > 80) {
                stopAutoplay();
                if (diff > 0) {
                    nextVideo();
                } else {
                    prevVideo();
                }
                startAutoplay();
            }
        }

        // Event listeners
        function setupEventListeners() {
            startButton.onclick = startShowcase;
            videoContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
            videoContainer.addEventListener('touchend', handleTouchEnd, { passive: true });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (!hasStarted) return;

                if (e.key === 'ArrowLeft') {
                    stopAutoplay();
                    prevVideo();
                    startAutoplay();
                } else if (e.key === 'ArrowRight') {
                    stopAutoplay();
                    nextVideo();
                    startAutoplay();
                }
            });

            // Prevent sleep
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => {});
            }
        }

        // Start
        init();
    </script>
</body>
</html>
